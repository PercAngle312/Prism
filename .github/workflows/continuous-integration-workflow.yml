name: Swiss build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Swiss
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest

    steps:
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -t bookworm-backports 7zip gcc gcc-mingw-w64-i686 libc6-dev libc6-i386 xorriso
        sudo dkp-pacman -Sy
        sudo dkp-pacman -S --noconfirm --ask 4 ppc-libiconv-lite

    - name: Checkout Swiss
      uses: actions/checkout@main
      with:
        path: swiss
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        submodules: true

    - name: Build Swiss artifacts
      run: make
      working-directory: swiss

    - name: Prepare single PRISM hardware DOL
      if: github.ref == 'refs/heads/feature/prism-dashboard' || github.head_ref == 'feature/prism-dashboard'
      id: prism
      shell: bash
      working-directory: swiss
      run: |
        commit=$(git rev-parse --short=12 HEAD)
        mkdir -p prism-hardware
        # Use the uncompressed DOL linked from this build's Swiss ELF.
        test -s cube/swiss/swiss.elf
        test -s cube/swiss/swiss.dol
        ${DEVKITPPC}/bin/powerpc-eabi-strings cube/swiss/swiss.elf | grep -F "PRISM BOOT CHECK V3"
        ${DEVKITPPC}/bin/powerpc-eabi-strings cube/swiss/swiss.dol | grep -F "PRISM BOOT CHECK V3"
        ${DEVKITPPC}/bin/powerpc-eabi-strings cube/swiss/swiss.dol | grep -F "A: Game info"
        ${DEVKITPPC}/bin/powerpc-eabi-strings cube/swiss/swiss.dol | grep -F "YOUR GAME LIBRARY"
        ${DEVKITPPC}/bin/powerpc-eabi-strings cube/swiss/swiss.dol | grep -F "X: Details"
        ${DEVKITPPC}/bin/powerpc-eabi-nm cube/swiss/swiss.elf | grep -F "prism_cover_cache_reserve"
        cp cube/swiss/swiss.dol "prism-hardware/PRISM-UI-${commit}.dol"
        cmp cube/swiss/swiss.dol "prism-hardware/PRISM-UI-${commit}.dol"
        sha256sum "prism-hardware/PRISM-UI-${commit}.dol"
        echo "commit=${commit}" >> "$GITHUB_OUTPUT"

    - name: Upload single PRISM hardware DOL
      if: steps.prism.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: PRISM-UI-${{ steps.prism.outputs.commit }}
        path: swiss/prism-hardware/*.dol
        if-no-files-found: error

    - name: Upload Swiss artifacts
      uses: actions/upload-artifact@main
      with:
        name: swiss-gc
        path: swiss/swiss_r*/*

  dolphin-ui:
    name: PRISM Dolphin UI smoke
    needs: build
    if: github.ref == 'refs/heads/feature/prism-dashboard' || github.head_ref == 'feature/prism-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Dolphin and screenshot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak xvfb xauth tesseract-ocr python3-pil
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists dolphin https://flatpak.dolphin-emu.org/releases.flatpakrepo
          flatpak install --user --noninteractive --assumeyes dolphin org.DolphinEmu.dolphin-emu
      - uses: actions/download-artifact@v4
        with:
          pattern: PRISM-UI-*
          path: dolphin-dol
          merge-multiple: true
      - name: Verify and launch the exact built PRISM DOL
        env:
          PRISM_DOLPHIN_FLATPAK: 1
        run: |
          /usr/bin/python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          files = list(Path('dolphin-dol').glob('*.dol'))
          assert len(files) == 1, files
          source = subprocess.check_output(['git', 'rev-parse', '--short=12', 'HEAD'], text=True).strip()
          assert files[0].name == f'PRISM-UI-{source}.dol', files[0]
          subprocess.run(['xvfb-run', '-a', '-s', '-screen 0 1280x960x24', '/usr/bin/python3',
              'tools/test_prism_dolphin.py', str(files[0]), 'dolphin-ui-results'], check=True)
          PYTHON
      - name: Upload Dolphin screenshots and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRISM-Dolphin-UI-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dolphin-ui-results/*.png
            dolphin-ui-results/*.txt
            dolphin-ui-results/*.json
            dolphin-ui-results/dolphin.log
          if-no-files-found: warn
