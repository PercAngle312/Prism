name: Prism navigation checks

on:
  push:
    branches: [feature/prism-dashboard]
  pull_request:
    paths:
      - 'cube/swiss/source/gui/prism_nav.*'
      - 'cube/swiss/source/gui/prism_game.*'
      - 'cube/swiss/source/gui/prism_library.*'
      - 'cube/swiss/source/gui/prism_metadata.*'
      - 'cube/swiss/source/gui/prism_pack.*'
      - 'tests/prism_nav_test.c'
      - 'tests/prism_game_test.c'
      - 'tests/prism_library_test.c'
      - 'tests/prism_metadata_test.c'
      - 'tests/prism_pack_test.c'
      - 'tools/prism_pack.py'
      - 'tools/prism_builder.py'
      - 'assets/prism/**'
      - '.github/workflows/prism-nav.yml'
  workflow_dispatch:

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build navigation unit test
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -o /tmp/prism-nav-test tests/prism_nav_test.c cube/swiss/source/gui/prism_nav.c
      - name: Run navigation unit test
        run: /tmp/prism-nav-test
      - name: Build and run disc header parser tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -o /tmp/prism-game-test tests/prism_game_test.c cube/swiss/source/gui/prism_game.c
          /tmp/prism-game-test
      - name: Build and run PRISM library tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -o /tmp/prism-library-test tests/prism_library_test.c cube/swiss/source/gui/prism_library.c
          /tmp/prism-library-test
      - name: Build and run offline synopsis metadata tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -o /tmp/prism-metadata-test tests/prism_metadata_test.c cube/swiss/source/gui/prism_metadata.c
          /tmp/prism-metadata-test
      - name: Build and run consolidated pack reader tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -o /tmp/prism-pack-test tests/prism_pack_test.c cube/swiss/source/gui/prism_pack.c
          /tmp/prism-pack-test
      - name: Generate deterministic example offline pack
        run: |
          python3 tools/prism_pack.py assets/prism/catalog.example.json /tmp/library.prism
          python3 tools/prism_pack.py assets/prism/catalog.example.json /tmp/library2.prism
          cmp /tmp/library.prism /tmp/library2.prism
      - name: Validate PRISM builder Python syntax
        run: python3 -m py_compile tools/prism_pack.py tools/prism_builder.py
